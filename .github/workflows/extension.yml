name: extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["extension/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["extension/**", ".github/workflows/extension.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and scripts
        working-directory: extension
        run: |
          node -e '
            const m = require("./manifest.json");
            if (m.manifest_version !== 3) throw new Error("must be MV3");
            const fs = require("fs");
            const files = [m.background.service_worker, m.options_page,
              ...m.content_scripts.flatMap(c => c.js),
              ...m.web_accessible_resources.flatMap(r => r.resources)];
            for (const f of files) if (!fs.existsSync(f)) throw new Error("missing " + f);
          '
          for f in *.js; do node --check "$f"; done
      - name: Package
        run: |
          VERSION=$(node -p 'require("./extension/manifest.json").version')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd extension && zip -r "../shepherd-extension-${VERSION}.zip" . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: shepherd-extension-*.zip
      - name: Create release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="extension-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Bump the version in extension/manifest.json to publish a new one."
          else
            gh release create "$TAG" shepherd-extension-*.zip \
              --target "$GITHUB_SHA" \
              --title "Extension v${VERSION}" \
              --generate-notes
          fi
