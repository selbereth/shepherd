services:
  server:
    build: ./server
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SHEPHERD_ADMIN_KEY: ${SHEPHERD_ADMIN_KEY:?set in .env}
      SHEPHERD_AUTO_BAN: ${SHEPHERD_AUTO_BAN:-false}
    volumes: ["./data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/docs')"]
      interval: 30s
